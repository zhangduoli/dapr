# Body 日志中间件组件
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: body-logger
spec:
  type: middleware.http.body2binding
  version: v1
  metadata:
  - name: logFile
    value: "./middleware-body.log"
  - name: logRequest
    value: "true"
  - name: logResponse
    value: "true"
  - name: maxBodySize
    value: "10240"  # 10KB
  - name: functionHeader
    value: "X-Function-Code"  # 功能码 header 名称
  - name: actionHeader
    value: "X-Action-Code"  # 动作码 header 名称
  - name: includePaths
    value: "^/v1.0/.*" # 只记录 /v1.0/ 开头的路径，支持正则表达式，逗号分隔多个模式
  - name: excludePaths
    value: "/health,\\?.*[Qq][Uu][Ee][Rr][Yy]" # 排除健康检查、url中包含query字符串，query字符不区分大小写，逗号分隔多个模式
  - name: logMethods
    value: "POST,PUT,DELETE"  # 需要记录日志的HTTP方法
  # Pub/Sub 推送配置（配置了 pubsubName + topicName 后优先走 pub/sub 发布）
  - name: pubsubName
    value: "rabbitmq-pubsub"  # 对应 rabbitmq-pubsub 组件的 metadata.name
  - name: topicName
    value: "default_topic"        # 默认 topic（不包含 meta 的消息）
  # 可选：审计 topic 推送配置（当消息包含 meta 时发布到该 topic）
  - name: auditPubsubName
    value: "rabbitmq-pubsub-audit" # 对应 rabbitmq-pubsub-audit 组件的 metadata.name
  - name: auditTopicName
    value: "ebr_audit_topic"       # 包含 meta 的消息发布到该 topic
  - name: includeHeaders
    value: "Authorization,User-Agent,Content-Type,X-Custom-Data,X-Permissions" # 需要记录的 header 名称，支持 JSON 格式
